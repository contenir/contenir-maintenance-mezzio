name: Block Attributions

on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  check-attributions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Commit Messages and PR Body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          PATTERN="(claude|co-authored-by:.*claude|generated-by:.*claude)"

          echo "Checking PR Title and Description..."
          if printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | grep -Eiq "$PATTERN"; then
            echo "::error::PR title or description contains Claude attributions."
            exit 1
          fi

          echo "Checking Commit Messages..."
          COMMITS=$(git log "origin/${BASE_REF}..HEAD" --format=%B)

          if printf '%s' "$COMMITS" | grep -Eiq "$PATTERN"; then
            echo "::error::One or more commit messages contain Claude signatures/attributions."
            echo "Please rewrite your commit messages to remove AI attributions."
            exit 1
          fi

          echo "All checks passed! No attributions found."
