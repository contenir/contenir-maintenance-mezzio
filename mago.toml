extends = "vendor/php-db/phpdb-qa-tools/mago.toml"
php-version = "8.3.0"

[source]
paths = ["src", "tests"]
includes = ["vendor"]

[formatter]
# Keep `(new Foo())->bar()`: CI formats under each job's PHP version, and the
# unparenthesised form PHP 8.4+ allows does not parse on 8.3, the minimum.
parentheses-around-new-in-member-access = true

[linter.rules]
# The shared base excludes "test/"; this repository keeps its suites under "tests/".
too-many-methods = { exclude = ["tests/"] }
# The suites predate the #[Test] / static::assert*() convention and still use
# behaviour-named test* methods with self::assert*(). Converting them is a
# mechanical follow-up; until then these two rules would flag every test.
prefer-test-attribute = { enabled = false }
assertion-style = { enabled = false }

[analyzer]
excludes = ["tests"]
