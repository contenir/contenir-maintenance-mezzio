extends = "vendor/php-db/phpdb-qa-tools/mago.toml"
php-version = "8.3.0"

[source]
paths = ["src", "test"]
includes = ["vendor"]

[formatter]
# Methods stay where the author put them; reading order carries meaning that
# alphabetical order does not.
sort-class-methods = false

[linter.rules]
# Tests follow the house PHPUnit standard: behaviour-named test* methods and
# self::assert*() calls, which these two rules would rewrite throughout.
prefer-test-attribute = { enabled = false }
assertion-style = { enabled = false }
# Shared test setup traits are named for what they do (UsesTemporaryDirectory),
# per the house PHPUnit standard, without a Trait suffix.
trait-name = { enabled = false }

[analyzer]
# Exceptions that bubble up transparently from the container, not ones this
# package raises itself.
unchecked-exceptions = [
    "Psr\\Container\\ContainerExceptionInterface",
    "Psr\\Container\\NotFoundExceptionInterface",
]
